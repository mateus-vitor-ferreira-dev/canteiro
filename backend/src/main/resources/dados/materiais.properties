# Valores padrão dos materiais, dentro do JAR.
# Para ajustar sem recompilar, copie este arquivo para ~/.canteiro/materiais.properties
# e mude os números lá: o que faltar ou vier inválido volta para o valor daqui (RNF11, RNF12).
#
# densidade: em toneladas por bloco, positiva
# cor: RRGGBB em hexadecimal
