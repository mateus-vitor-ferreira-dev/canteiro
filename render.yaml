# Blueprint do Render: um serviço web, construído pelo Dockerfile da raiz.
# Tudo o que importa está no Dockerfile; trocar de hospedagem é subir a mesma imagem em outro lugar.
services:
  - type: web
    name: canteiro
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/dificuldades
    autoDeploy: true
    envVars:
      - key: CANTEIRO_LIMITE_PARTIDAS
        value: "10"
