# Roda os testes do backend e do frontend em todo PR e em todo push na develop.
# O JAR completo fica anexado ao resultado, para quem quiser testar o jogo sem compilar.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Testes, arquitetura e Javadoc
        run: ./mvnw -B -ntp verify javadoc:javadoc -Dfrontend.pular=true

  frontend:
    name: Frontend (Svelte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: ESLint e Prettier
        run: npm run lint
      - name: Tipos
        run: npm run check
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  jar:
    name: JAR completo
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Empacota o backend com o frontend dentro
        run: ./mvnw -B -ntp package -DskipTests
      - uses: actions/upload-artifact@v7
        with:
          name: canteiro-jar
          path: backend/target/canteiro.jar
          retention-days: 14
